<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Notion처럼 쓰는 개인용 지식 관리 웹앱 · 한 개의 HTML 파일">
</head>
<body>
<title>My Notion</title>
<style>
:root{
  --bg:#ffffff;--side:#f7f7f5;--text:#37352f;--muted:#787774;--hover:rgba(55,53,47,.08);--border:rgba(55,53,47,.13);
  --accent:#2383e2;--danger:#e03e3e;--code:#f3f3f1;--callout:#f1f1ef;--sel:rgba(35,131,226,.15);--menu:#ffffff;--inl:#eb5757;
  --shadow:0 0 0 1px rgba(15,15,15,.05),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.2);
  --c-gray:#e3e2e0;--c-brown:#eee0da;--c-orange:#fadec9;--c-yellow:#fdecc8;--c-green:#dbeddb;--c-blue:#d3e5ef;--c-purple:#e8deee;--c-pink:#f5e0e9;--c-red:#ffe2dd;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191919;--side:#202020;--text:#d4d4d4;--muted:#9b9b9b;--hover:rgba(255,255,255,.07);--border:rgba(255,255,255,.11);--code:#2a2a2a;--callout:#262626;--menu:#252525;--inl:#ff7369;
  --shadow:0 0 0 1px rgba(255,255,255,.08),0 3px 6px rgba(0,0,0,.3),0 9px 24px rgba(0,0,0,.4);
  --c-gray:#3a3a3a;--c-brown:#4a3228;--c-orange:#5c3b23;--c-yellow:#564328;--c-green:#243d30;--c-blue:#143a4e;--c-purple:#3c2d49;--c-pink:#4e2c3c;--c-red:#522e2a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191919;--side:#202020;--text:#d4d4d4;--muted:#9b9b9b;--hover:rgba(255,255,255,.07);--border:rgba(255,255,255,.11);--code:#2a2a2a;--callout:#262626;--menu:#252525;--inl:#ff7369;
  --shadow:0 0 0 1px rgba(255,255,255,.08),0 3px 6px rgba(0,0,0,.3),0 9px 24px rgba(0,0,0,.4);
  --c-gray:#3a3a3a;--c-brown:#4a3228;--c-orange:#5c3b23;--c-yellow:#564328;--c-green:#243d30;--c-blue:#143a4e;--c-purple:#3c2d49;--c-pink:#4e2c3c;--c-red:#522e2a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Helvetica,Arial,sans-serif;display:flex;overflow:hidden;margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* sidebar */
#side{width:var(--sidew,248px);flex:none;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;min-height:0;transition:margin-left .2s;position:relative}
body.noside #side{margin-left:calc(-1 * var(--sidew,248px) - 1px)}
.ws{padding:10px 8px 10px 14px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.logo{width:22px;height:22px;border-radius:5px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700}
.grow{flex:1;min-width:0}
.ibtn{width:28px;height:28px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.ibtn:hover,.sbtn:hover,.item:hover,.c:hover,#addIcon:hover,#icon:hover{background:var(--hover)}
.sbtn{display:flex;align-items:center;gap:8px;padding:5px 10px;margin:0 6px;border-radius:5px;color:var(--muted);font-size:14px;width:calc(100% - 12px);text-align:left}
.sbtn kbd{margin-left:auto;font:11px inherit;opacity:.7}
.sec{font-size:12px;color:var(--muted);padding:16px 16px 4px;font-weight:600}
#tree{flex:1 1 auto;min-height:60px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:0 6px 10px;scrollbar-gutter:stable}
.item{display:flex;align-items:center;gap:2px;height:30px;border-radius:5px;font-size:14px;cursor:pointer;padding-right:4px;user-select:none}
.item.active{background:var(--hover);font-weight:600}
.item.dropin{box-shadow:inset 0 0 0 2px var(--accent)}
.item.dropbefore{box-shadow:inset 0 2px 0 var(--accent)}
.item.dropafter{box-shadow:inset 0 -2px 0 var(--accent)}
.tw{width:20px;height:20px;display:grid;place-items:center;border-radius:4px;color:var(--muted);font-size:9px;flex:none;transition:transform .15s}
.tw:hover{background:var(--hover)}
.item.open>.tw{transform:rotate(90deg)}
.ic{width:22px;text-align:center;flex:none}
.nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.acts{display:none;gap:2px}
.item:hover .acts,.item.active .acts{display:flex}
.acts button{width:24px;height:24px;border-radius:4px;color:var(--muted);font-size:13px}
.acts button:hover{background:var(--hover)}
.empty{font-size:13px;color:var(--muted);height:26px;display:flex;align-items:center}
.sfoot{border-top:1px solid var(--border);padding:6px 0;flex:none;max-height:45%;overflow-y:auto}
#shade{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39}
/* main */
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
#top{height:44px;display:flex;align-items:center;gap:6px;padding:0 10px;flex:none}
#crumbs{flex:1;display:flex;align-items:center;font-size:14px;overflow:hidden;white-space:nowrap;min-width:0}
.c{padding:2px 6px;border-radius:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.sep{color:var(--muted);padding:0 2px}
#meta{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:#2f9e6a}.dot.busy{background:#d9a21b}.dot.err{background:var(--danger)}.dot.off{background:#8a8f98;box-shadow:0 0 0 2px rgba(138,143,152,.25)}
#scroll{flex:1;overflow:auto}
#page{max-width:900px;margin:0 auto;padding:64px 56px 0 64px}
#page.wide{max-width:none;padding-left:64px;padding-right:32px}
#head{position:relative}
#addIcon{font-size:14px;color:var(--muted);padding:4px 8px;border-radius:5px;opacity:0;transition:opacity .15s}
#head:hover #addIcon{opacity:1}
#icon{font-size:64px;line-height:1.1;cursor:pointer;border-radius:8px;display:inline-block;padding:4px}
#title{font-size:40px;font-weight:700;line-height:1.2;outline:none;margin:6px 0 18px;word-break:break-word;text-wrap:balance}
#title:empty::before{content:'제목 없음';color:var(--muted);opacity:.5}
#loading{padding:80px 0;color:var(--muted);text-align:center}
/* blocks */
.block{position:relative;display:flex;margin:1px 0;border-radius:4px}
.block.dragging{opacity:.4}
.block.drop-before::after,.block.drop-after::after{content:'';position:absolute;left:0;right:0;height:3px;background:rgba(35,131,226,.6);border-radius:2px}
.block.drop-before::after{top:-2px}.block.drop-after::after{bottom:-2px}
.gutter{position:absolute;left:-50px;top:0;width:48px;display:flex;justify-content:flex-end;padding-top:3px;opacity:0;transition:opacity .1s}
.block:hover>.gutter{opacity:1}
.gutter button,.handle{width:22px;height:24px;display:grid;place-items:center;color:var(--muted);border-radius:4px;font-size:18px;cursor:pointer;user-select:none}
.handle{cursor:grab;font-size:14px}
.gutter button:hover,.handle:hover{background:var(--hover)}
.body{flex:1;display:flex;flex-wrap:wrap;min-width:0;align-items:flex-start}
.ed{flex:1;min-width:0;outline:none;padding:3px 2px;white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.ed:empty::before,.ed2:empty::before{content:attr(data-ph);color:var(--muted);opacity:.6;pointer-events:none}
.t-p .ed:empty:not(:focus)::before{content:none}
.ed2{flex-basis:100%;outline:none;padding:2px 2px 2px 26px;white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.ed code,.ed2 code{background:var(--code);color:var(--inl);padding:.1em .35em;border-radius:4px;font:85% ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ed a,.ed2 a{color:inherit;text-decoration:underline;text-decoration-color:var(--muted)}
.t-h1{margin-top:1.4em}.t-h2{margin-top:1.1em}.t-h3{margin-top:.8em}
.t-h1 .ed{font-size:1.875em;font-weight:700;line-height:1.3}
.t-h2 .ed{font-size:1.5em;font-weight:650;line-height:1.3}
.t-h3 .ed{font-size:1.25em;font-weight:600;line-height:1.3}
.t-h1 .gutter{padding-top:12px}.t-h2 .gutter{padding-top:8px}.t-h3 .gutter{padding-top:5px}
.mk{width:24px;flex:none;text-align:center;padding-top:3px;user-select:none;line-height:1.5}
.t-ul .mk{font-size:1.3em;line-height:1.15}
.t-ol .mk{font-variant-numeric:tabular-nums;width:auto;min-width:24px;padding-right:3px;white-space:nowrap}
.chk{width:16px;height:16px;margin:6px 6px 0 4px;flex:none;accent-color:var(--accent);cursor:pointer}
.done .ed{text-decoration:line-through;color:var(--muted)}
.tg{font-size:10px;color:var(--muted);height:24px;width:24px;flex:none;margin-right:4px;border:0;background:none;padding:0;cursor:pointer;border-radius:4px;transition:transform .15s}
.tg:hover{background:var(--hover)}
.open .tg{transform:rotate(90deg)}
.t-quote .body{border-left:3px solid currentColor;padding-left:12px;margin:4px 0}
.t-callout .body{background:var(--callout);padding:12px 14px 12px 8px;border-radius:6px;margin:4px 0}
.ci{cursor:pointer;font-size:1.15em;line-height:1.3}
.t-code .body{background:var(--code);border-radius:6px;padding:30px 18px 16px;margin:4px 0;position:relative}
.t-code .ed{font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow-x:auto;tab-size:2}
.lang{position:absolute;top:8px;left:18px;font-size:12px;color:var(--muted)}
.focusbox{outline:none;border-radius:6px;width:100%}
.focusbox:focus{box-shadow:0 0 0 3px var(--sel)}
.focusbox hr{border:0;border-top:1px solid var(--border);margin:12px 0;width:100%}
.pagelink{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:4px;cursor:pointer;width:100%;outline:none}
.pagelink:hover,.pagelink:focus{background:var(--hover)}
.pl{border-bottom:1px solid var(--border);font-weight:500}
.gone{color:var(--muted);cursor:default}
#tail{height:35vh;cursor:text}
/* media blocks */
.fig{margin:4px 0;width:100%}
.fig img{max-width:100%;border-radius:4px;display:block;background:var(--callout)}
.cap{font-size:14px;color:var(--muted);outline:none;padding:4px 2px;min-height:1.4em}
.cap:empty::before{content:'캡션 추가';opacity:.5}
.fig:not(:hover) .cap:empty:not(:focus)::before{content:none}
.uplbtn{width:100%;text-align:center;padding:22px 14px;background:var(--callout);border:2px dashed var(--border);border-radius:8px;color:var(--muted);font-size:14px;margin:4px 0;display:flex;flex-direction:column;gap:4px;align-items:center;cursor:pointer}
.uplbtn .ut{font-weight:600;color:var(--text);font-size:15px}
.uplbtn.over,.uplbtn:focus{border-color:var(--accent);outline:none}
.uplbtn:hover{background:var(--hover)}
.filebox{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;margin:4px 0}
.fic{font-size:22px}
.fn{font-weight:500;word-break:break-all}.fs{font-size:12px;color:var(--muted)}
video.vid{max-width:100%;border-radius:6px;display:block;margin:4px 0}
.btn{padding:4px 10px;border-radius:5px;font-size:14px;border:1px solid var(--border);background:var(--bg);color:var(--text);text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
/* database */
.dbbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:2px}
.tabs{display:flex;gap:2px}
.tabs button{padding:4px 8px;border-radius:5px;font-size:14px;color:var(--muted)}
.tabs button:hover{background:var(--hover)}
.tabs button.on{color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--text);border-radius:0}
.dbq{border:1px solid var(--border);background:var(--bg);color:inherit;border-radius:5px;padding:4px 8px;font:inherit;font-size:14px;width:150px;max-width:40vw}
.tblwrap{overflow-x:auto;margin-bottom:24px}
.tbl{border-collapse:collapse;font-size:14px;min-width:100%}
.tbl th{font-weight:500;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;cursor:pointer;min-width:150px;user-select:none}
.tbl th:hover{background:var(--hover)}
.tbl td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:0;height:36px;vertical-align:middle;min-width:150px}
.tbl th:last-child,.tbl td:last-child{border-right:0;min-width:44px;width:44px}
.tbl .tcol{min-width:240px}
.pi{opacity:.75;margin-right:6px;font-size:12px}
.tname{display:flex;align-items:center;gap:6px;padding:4px 8px}
.rt{flex:1;outline:none;font-weight:500;min-width:40px;word-break:break-word}
.rt:empty::before{content:'제목 없음';color:var(--muted);opacity:.6}
.rbtn{opacity:0;font-size:12px;border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--muted);background:var(--bg)}
tr:hover .rbtn,.rbtn:focus{opacity:1}
.cin{width:100%;border:0;background:none;color:inherit;font:inherit;font-size:14px;padding:6px 8px;outline:none;height:34px;min-width:0}
.cin:focus{box-shadow:inset 0 0 0 2px var(--accent);border-radius:3px}
input.cin[type=checkbox]{width:16px;height:16px;margin:0 8px;accent-color:var(--accent);cursor:pointer}
.urlc{display:flex;align-items:center}
.urlc a{padding:0 8px;color:var(--muted);text-decoration:none}
.tags{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;min-height:34px;cursor:pointer;align-items:center;border-radius:3px}
.tags:hover{background:var(--hover)}
.tags .ph{color:var(--muted);opacity:.6;font-size:13px}
.tag{padding:0 7px;border-radius:4px;font-size:13px;line-height:21px;white-space:nowrap;color:var(--text);background:var(--c-gray)}
.c-gray{background:var(--c-gray)}.c-brown{background:var(--c-brown)}.c-orange{background:var(--c-orange)}.c-yellow{background:var(--c-yellow)}.c-green{background:var(--c-green)}.c-blue{background:var(--c-blue)}.c-purple{background:var(--c-purple)}.c-pink{background:var(--c-pink)}.c-red{background:var(--c-red)}
.newrow td{border-right:0}
.newrow button{padding:7px 8px;width:100%;text-align:left;color:var(--muted);font-size:14px}
.newrow button:hover{background:var(--hover)}
.dbempty{color:var(--muted);font-size:14px;padding:18px 8px}
.board{display:flex;gap:12px;overflow-x:auto;padding:8px 0 24px;align-items:flex-start}
.col{width:260px;flex:none;border-radius:8px;padding:6px;background:var(--side)}
.col.over{box-shadow:inset 0 0 0 2px var(--accent)}
.colh{display:flex;align-items:center;gap:6px;padding:4px 4px 8px;font-size:14px}
.cnt{color:var(--muted);font-size:13px}
.card{background:var(--bg);border-radius:6px;box-shadow:0 0 0 1px var(--border),0 1px 2px rgba(0,0,0,.06);padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:14px}
.card:hover{background:var(--hover)}
.ct{font-weight:500;margin-bottom:4px;word-break:break-word}
.cm{display:flex;flex-wrap:wrap;gap:4px;font-size:12px;color:var(--muted)}
.colnew{width:100%;text-align:left;padding:6px;color:var(--muted);font-size:14px;border-radius:5px}
.colnew:hover{background:var(--hover)}
#props{margin:-6px 0 16px;border-bottom:1px solid var(--border);padding-bottom:10px}
.prow{display:flex;align-items:center;min-height:36px;font-size:14px;gap:8px}
.pk{width:150px;flex:none;color:var(--muted);display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap}
.pv{flex:1;min-width:0;border-radius:4px}
.pv:hover{background:var(--hover)}
/* menus */
.menu{position:fixed;background:var(--menu);box-shadow:var(--shadow);border-radius:8px;padding:6px;z-index:50;min-width:230px;max-width:calc(100vw - 16px);max-height:min(380px,80vh);overflow:auto;font-size:14px}
.mh{font-size:12px;color:var(--muted);padding:6px 8px 4px}
.mi{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:5px;cursor:pointer}
.mi.sel,.mi:hover{background:var(--hover)}
.mi .x{margin-left:auto;color:var(--muted);width:20px;height:20px;border-radius:4px;font-size:11px}
.mi .x:hover{background:var(--hover)}
.min{width:100%;border:1px solid var(--border);background:var(--bg);color:inherit;font:inherit;font-size:14px;border-radius:5px;padding:5px 8px;margin-bottom:4px;outline:none}
.min:focus{border-color:var(--accent)}
.bi{width:40px;height:40px;border:1px solid var(--border);border-radius:6px;display:grid;place-items:center;background:var(--bg);font-size:14px;flex:none;font-weight:600}
.bi.s{width:22px;height:22px;border:0;background:none;font-weight:500}
.d{font-size:12px;color:var(--muted)}
.eg{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;padding:4px;max-height:236px;overflow-y:auto;overscroll-behavior:contain}
#emoji{width:352px;max-width:calc(100vw - 16px)}
.ehd{display:flex;gap:4px;padding:6px 6px 2px;align-items:center}
.esr{flex:1;min-width:0;border:1px solid var(--border);border-radius:6px;padding:5px 8px;font:inherit;font-size:13px;background:var(--bg);color:var(--text)}
.etabs{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;padding:4px 6px 6px;border-bottom:1px solid var(--border);scrollbar-width:thin;scroll-behavior:smooth;overscroll-behavior-x:contain}
.etabs::-webkit-scrollbar{height:6px}.etabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.etabw{display:flex;align-items:stretch;flex:none}.etabw .etabs{flex:1;min-width:0}
.earr{flex:none;width:22px;font-size:14px;color:var(--muted);border-bottom:1px solid var(--border)}.earr:hover{background:var(--hover);color:var(--text)}.earr[disabled]{opacity:.25;pointer-events:none}
#emoji{display:flex;flex-direction:column;max-height:calc(100vh - 16px);overflow:hidden}
#emoji .eg{flex:1 1 auto;min-height:80px}
.eg::-webkit-scrollbar{width:8px}.eg::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.etab{flex:none;font-size:12px;padding:3px 8px;border-radius:5px;color:var(--muted);white-space:nowrap}
.etab:hover{background:var(--hover)}.etab.on{background:var(--hover);color:var(--text);font-weight:600}
.eft{display:flex;align-items:center;gap:6px;border-top:1px solid var(--border);padding:2px 4px 0}.eft .d{flex:1;font-size:11px;color:var(--muted);padding-left:4px}.eft .mi{width:auto}
.eb{font-size:20px;width:34px;height:34px;border-radius:5px;line-height:1}
.eb:hover{background:var(--hover)}
.eb:hover{background:var(--hover)}
#fmt{position:fixed;z-index:60;display:flex;background:var(--menu);box-shadow:var(--shadow);border-radius:6px;padding:3px}
#fmt button{min-width:30px;height:28px;border-radius:4px;font-size:14px;padding:0 6px}
#fmt button:hover{background:var(--hover)}
#searchWrap,#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 0}
#modal{z-index:85;align-items:center;padding:16px}
#searchBox{width:100%;max-width:600px;background:var(--menu);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
#q{width:100%;border:0;border-bottom:1px solid var(--border);background:none;color:inherit;font:inherit;font-size:17px;padding:14px 18px;outline:none}
#results{max-height:50vh;overflow:auto;padding:6px}
.r{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;gap:10px}
.r.sel,.r:hover{background:var(--hover)}
.r .t{font-weight:500}.r .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 'appVer' sorts versions: the app was 5.x internally before the 2.0.0 release */
const WHATS_NEW=[
 ['🖍','캘린더 주말 · 강조','캘린더 보기에서 토요일은 파란 칸, 일요일은 빨간 칸에 흰 글씨로 보여요(‘주말 색’으로 끄고 켜기). 날짜 칸의 🖍 또는 오른쪽 클릭으로 칸 색·날짜 글자색·짧은 메모를, 일정을 오른쪽 클릭해서 배경 강조나 글자색을 넣을 수 있어요.','v2.2.0'],
 ['📅','날짜 기간 · 시각','데이터베이스 날짜 속성을 누르면 ‘연도-월-일 시각 부터 연도-월-일 시각 까지’를 정할 수 있어요(종료 날짜·시각은 켜고 끌 수 있어요). 캘린더 보기에서는 기간 동안 매일 표시되고, 다른 날로 끌면 기간째 옮겨져요.','v2.2.0'],
 ['Aa','블록 서식','블록 ⋯ 메뉴 → ‘블록 서식’에서 블록마다 정렬(왼쪽·가운데·오른쪽·양쪽), 글자 크기, 굵게·기울임·밑줄·취소선, 글꼴(기본·명조·고정폭·둥근), 줄 간격, 위·아래 여백, 상자(테두리·배경·왼쪽 막대·그림자)를 정해요. 여러 블록을 골라 한 번에 바꿀 수도 있어요.','v2.2.0'],
 ['🏷','캡션 서식','그림·파일·동영상 아래 캡션을 넣고, 블록 ⋯ 메뉴 → ‘캡션 서식’에서 정렬·크기·굵게·기울임·색을 바꿔요. 캡션 글자 일부를 골라 굵게·색을 넣을 수도 있어요.','v2.2.0'],
 ['▥','단 나누기','/2단 · /3단 · /4단으로 글을 여러 단으로 나눠 써요. 단 사이 구분선 9가지(실선·점선·점·이중선·굵은 선·흐려지는 선·물결선·지그재그·없음)와 색, 간격, 단마다 배경·글자색·정렬·굵게·테두리, 바깥 상자, 단 번호를 고를 수 있어요. 경계를 끌어 너비 조절, 최대 6단. 여러 문단을 골라 ‘블록 전환 → 2단’ 하면 문단마다 한 단이 돼요.','v2.2.0'],
 ['📙','PPT·Word·Excel 첨부','파일 블록에 PPTX·DOCX·XLSX·HWP·ZIP 등 거의 모든 파일(최대 100MB)을 올리고 내려받을 수 있어요. 미리보기는 안 되고 다운로드로 열어요.','v2.1.1'],
 ['🗑','같은 상태·태그 한 번에 삭제','데이터베이스 위 ‘🗑 일괄 삭제’에서 속성(상태·태그·체크박스)과 값을 고르면 그 값인 항목을 모두 휴지통으로 옮겨요. 보드에서는 열 제목 옆 🗑로 그 열 항목을 한 번에 지울 수 있어요.','v2.1.1'],
 ['⇅','정렬 기준 여러 개','데이터베이스 ⇅ 정렬에서 기준을 여러 개 쌓고(위에 있는 기준이 먼저), ↑↓로 순서를 바꾸고, 기준마다 ✕로 지울 수 있어요. ‘모든 정렬 삭제’도 있어요.','v2.1.1'],
 ['N','Notion 연동','페이지 ⋯ → ‘Notion 연동’. 이 페이지(하위 포함)나 전체 워크스페이스를 Notion이 가져올 수 있는 ZIP(Markdown·CSV·첨부)으로 내보내고, Notion에서 내보낸 ZIP은 📥 가져오기로 넣어요.','v2.1.0'],

/* =========================================================
   Security: HTML sanitizer (whitelist) + URL checks
   ========================================================= */
const COLOR_CLS=/^(tc|bg)-(default|gray|brown|orange|yellow|green|blue|purple|pink|red)$/;
const ALLOWED_TAGS=new Set(['B','STRONG','I','EM','U','S','STRIKE','DEL','CODE','A','BR','SPAN','DIV','P']);
const DROP_TAGS=new Set(['SCRIPT','STYLE','IFRAME','FRAME','OBJECT','EMBED','SVG','MATH','TEMPLATE','NOSCRIPT','TEXTAREA','SELECT','INPUT','BUTTON','FORM','IMG','VIDEO','AUDIO','SOURCE','LINK','META','BASE','TITLE','HEAD']);
function safeUrl(u){
  u=String(u||'').trim().replace(/[\u0000-\u001f\u007f]/g,'');
  if(!u)return '';
  if(/^(https?:|mailto:)/i.test(u))return u;
  if(/^[a-z][a-z0-9+.-]*:/i.test(u))return '';   // javascript:, data:, vbscript: … blocked
  if(u.startsWith('//'))return 'https:'+u;
  return 'https://'+u.replace(/^\/+/,'');
}
function sanitize(html){
  const t=document.createElement('template');t.innerHTML=String(html??'');
  const walk=node=>{[...node.childNodes].forEach(n=>{
    if(n.nodeType===3)return;
    if(n.nodeType!==1){n.remove();return}
    if(DROP_TAGS.has(n.tagName)){n.remove();return}
    walk(n);
    if(!ALLOWED_TAGS.has(n.tagName)){n.replaceWith(...n.childNodes);return}
    [...n.attributes].forEach(a=>{
      if(n.tagName==='A'&&a.name==='href')return;
      if(n.tagName==='SPAN'&&a.name==='class'){const ok=a.value.split(/\s+/).filter(c=>COLOR_CLS.test(c));if(ok.length){n.setAttribute('class',ok.join(' '));return}}
      n.removeAttribute(a.name)});
    if(n.tagName==='SPAN'&&!n.getAttribute('class')){n.replaceWith(...n.childNodes);return}
    if(n.tagName==='A'){const u=safeUrl(n.getAttribute('href'));if(u){n.setAttribute('href',u);n.setAttribute('target','_blank');n.setAttribute('rel','noopener noreferrer')}else n.replaceWith(...n.childNodes)}
  })};
  walk(t.content);
  const d=document.createElement('div');d.appendChild(t.content);return d.innerHTML;
}
const strip=h=>{const t=document.createElement('template');t.innerHTML=String(h||'');return t.content.textContent||''};
function clean(h){const s=sanitize(String(h??'').replace(/\u200B/g,''));if(!strip(s))return '';return s.replace(/<br\s*\/?>$/i,'')}
const ASSET_ID=/^[A-Za-z0-9_-]{8,80}$/;
const DATA_OK=/^data:(image\/(png|jpeg|gif|webp|svg\+xml)|video\/(mp4|webm)|application\/(pdf|json)|text\/(plain|csv|markdown));base64,[A-Za-z0-9+/=]+$/;
const assetUrl=b=>b.asset&&ASSET_ID.test(b.asset)?'/_blob/'+b.asset:(b.data&&DATA_OK.test(b.data)?b.data:'');

    const col=String(b.color||'').split(/\s+/).filter(c=>COLOR_CLS.test(c)).join(' ');
    const bcs=bstCss(b);const st=d||bcs?` style="${d?`margin-left:${d*18}pt;`:''}${bcs}"`:'';const t=sanitize(b.text||'');
    const wrap=(cls,inner)=>`<div class="b ${cls} ${col}"${st}>${inner}</div>`;
    switch(b.type){

      case 'quote':out+=wrap('quote',t);break;

      case 'table':out+=`<div${st}>${tableToHtml(b)}</div>`;break;
      case 'chart':{const c=b.chart||{};const w=Math.max(20,Math.min(100,+c.w||100));out+=`<figure class="chart" style="margin:6pt ${c.align==='right'?'0':c.align==='center'?'auto':'auto'} 6pt ${c.align==='left'||!c.align?'0':'auto'};width:${w}%${d?`;margin-left:${d*18}pt`:''}">${chartSvg(b,Math.round(680*w/100),Math.min(+c.h||320,900))}</figure>`;break}

/* a minimal PDF: one JPEG picture per page */
function jpegPdf(pages,pt){

  offs[2]=len;put(`2 0 obj\n<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>\nendobj\n`);
  pages.forEach((p,i)=>{const o=3+i*3;
    offs[o]=len;put(`${o} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pt[0]} ${pt[1]}] /Resources << /XObject << /Im${i} ${o+2} 0 R >> >> /Contents ${o+1} 0 R >>\nendobj\n`);
    const cs=`q ${pt[0]} 0 0 ${pt[1]} 0 0 cm /Im${i} Do Q`;
    offs[o+1]=len;put(`${o+1} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
    offs[o+2]=len;put(`${o+2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`);put(p.jpeg);put('\nendstream\nendobj\n');

async function pdfRender(id,withSubs,paperKey,marginMm,onProgress){

/* the sidebar tree is rebuilt from each page's own `parent` field, so that the
   parent's children list, the top-level order and the parent links always agree
   (after offline edits, recovery, merges and imports) */
function reconcileTree(){
  if(!S)return;const P=S.pages;let metaCh=false;const ch=new Set();
  const loading=id=>!!(id&&!P[id]&&RAW[id]&&!TOMB[id]);    // page still arriving in pieces
  // 1) a valid parent for every page
  Object.values(P).forEach(p=>{
    if(p.parent&&!P[p.parent]&&!loading(p.parent)){p.parent=null;if(p.row){delete p.row}ch.add(p.id)}
    if(p.parent===p.id){p.parent=null;ch.add(p.id)}
  });
  Object.values(P).forEach(p=>{     // break cycles
    const seen=new Set([p.id]);let x=p.parent;
    while(x&&P[x]){if(seen.has(x)){p.parent=null;ch.add(p.id);break}seen.add(x);x=P[x].parent}
  });
  Object.values(P).forEach(p=>{
    if(p.row&&!p.parent){delete p.row;ch.add(p.id)}
    const t=p.trashed;if(!t)return;
    if(!t.root&&!(t.by&&P[t.by]&&P[t.by].trashed)){p.trashed={at:t.at||Date.now(),root:true,parent:p.parent,index:0};ch.add(p.id)}   // its trashed ancestor is gone: show it in the trash
  });
  for(let more=true,guard=0;more&&guard<50;guard++){more=false;
    Object.values(P).forEach(p=>{     // a live page under a trashed parent goes to the trash with it
      if(p.trashed||!p.parent||!P[p.parent]||!P[p.parent].trashed)return;
      const pt=P[p.parent].trashed;p.trashed={at:pt.at,root:false,by:pt.root?p.parent:pt.by};ch.add(p.id);more=true;
    });}
  // 2) children lists and the top level, keeping the existing order
  const kidsOf={};
  Object.values(P).forEach(p=>{if(p.trashed&&p.trashed.root)return;const k=p.parent&&P[p.parent]?p.parent:p.parent?null:'';if(k===null)return;(kidsOf[k]=kidsOf[k]||[]).push(p)});
  const rebuild=(cur,kids)=>{
    const want=new Set(kids.map(p=>p.id));
    const out=[];(cur||[]).forEach(id=>{if((want.has(id)||loading(id))&&!out.includes(id))out.push(id)});
    kids.filter(p=>!out.includes(p.id)).sort((a,b)=>(a.created||0)-(b.created||0)).forEach(p=>out.push(p.id));
    return out;
  };
  Object.values(P).forEach(p=>{
    const nx=rebuild(p.children,kidsOf[p.id]||[]);
    if(J(nx)!==J(p.children)){p.children=nx;ch.add(p.id)}
  });

  const nr=rebuild(S.root,top);

  ch.forEach(id=>markDirty(id));if(metaCh)markDirty('meta');
  return ch.size+(metaCh?1:0);
}

function normalizePage(p){

const slash={open:false,idx:0,q:null};
function slashCheck(e,b){
  if(b.type==='code'){closeSlash();return}
  const off=caretOffset(e);const t=e.textContent.slice(0,off);
  const m=t.match(/(?:^|\s)\/([^\s/]{0,20})$/);

    if(!q)return x.hidden?-1:2;
    const md=x.md||[];
    if(md.includes(q))return 0;
    if(md.some(a=>a.startsWith(q)))return 1;
    if(x.hidden&&/^[^A-Za-z0-9가-힣]+$/.test(q))return -1;
    if((x.label+' '+x.k).toLowerCase().includes(q.toLowerCase())||(x.label+x.k).toLowerCase().replace(/\s/g,'').includes(qq))return 2;

async function retryHistRestore(list){

        let got;if(await blobExists(f.oldId))got={asset:f.oldId};else{const zf=zip.file(info.path);if(!zf)throw{code:'not_in_zip'};const mime=OK_TYPES.has(info.mime)?info.mime:'';if(!mime)throw{code:'unsupported_type'};got=await uploadBlob(new Blob([await zf.async('arraybuffer')],{type:mime}),mime)}

      }catch(err){left.push({...f,reason:err&&err.code==='not_in_zip'?'백업에 파일이 들어 있지 않아요':uploadMsg(err)})}

  };
}


/* ---------- markdown export ---------- */
function htmlToMd(h){
  const t=document.createElement('template');t.innerHTML=sanitize(h);
  const walk=n=>{if(n.nodeType===3)return n.textContent;const s=[...n.childNodes].map(walk).join('');
    switch(n.nodeName){case'B':case'STRONG':return s?`**${s}**`:'';case'I':case'EM':return s?`*${s}*`:'';case'S':case'STRIKE':case'DEL':return s?`~~${s}~~`:'';case'CODE':return '`'+s+'`';case'A':return `[${s}](${n.getAttribute('href')})`;case'BR':return '\n';case'DIV':case'P':return '\n'+s;default:return s}};
  return [...t.content.childNodes].map(walk).join('');
}
function blocksToMd(blocks){
  const out=[];const cnt=[];
  blocks.forEach(b=>{
    const d=b.indent|0,pd='  '.repeat(d),t=htmlToMd(b.text);cnt.length=d+1;
    let ol='';if(b.type==='ol')ol=olItem(cnt,b,d);else cnt[d]=0;
    if(b.type==='table'){out.push(tableToMd(b).split('\n').map(x=>pd+x).join('\n'));return}
    if(b.type==='chart'){out.push(chartToMd(b));return}
    const L={p:t,h1:'# '+t,h2:'## '+t,h3:'### '+t,ul:'- '+t,ol:`${ol} `+t,todo:`- [${b.checked?'x':' '}] `+t,quote:'> '+t,callout:`<aside>\n${b.icon||'💡'} ${t}\n</aside>`,
      toggle:`- ▸ ${t}`,code:'```\n'+strip(b.text)+'\n```',divider:'---',page:(MD_HOOK&&MD_HOOK.link(b.ref))?`[${S.pages[b.ref]?.title||'페이지'}](${MD_HOOK.link(b.ref)})`:`📄 ${S.pages[b.ref]?.title||'페이지'}`,
      image:`![${strip(b.caption)||b.name||''}](${(MD_HOOK&&MD_HOOK.img(b))||b.name||'image'})`,file:`📎 ${b.name||'파일'}`}[b.type]??t;
    out.push(pd+L);if(!LISTY.includes(b.type)||b.type==='toggle')out.push('');
  });
  return out.join('\n').replace(/\n{3,}/g,'\n\n');
}
function pageToMd(p){
  const out=[`# ${p.icon?p.icon+' ':''}${p.title||'제목 없음'}`,''];
  if(p.kind==='db'){
    const view=curView(p);const rows=dbRows(p,view);const cols=['이름',...p.schema.map(x=>x.name)];const cell=s=>String(s).replace(/\|/g,'\\|').replace(/\n/g,' ');
    out.push('| '+cols.map(cell).join(' | ')+' |','|'+cols.map(()=>' --- ').join('|')+'|');
    rows.forEach(r=>out.push('| '+[r.title||'',...p.schema.map(pr=>valText(pr,val(p,r,pr)))].map(cell).join(' | ')+' |'));
    return out.join('\n');
  }
  if(p.row){const db=dbOf(p);if(db&&db.schema)rowSchema(db,p).forEach(pr=>{const v=valText(pr,val(db,p,pr));if(v)out.push(`- **${pr.name}**: ${v}`)});out.push('')}

  return out.join('\n').replace(/\n{3,}/g,'\n\n');
}

    const from=d<0?all.indexOf(ids[0]):all.indexOf(ids[ids.length-1]);const ni=Math.max(0,Math.min(all.length-1,from+d));
    if(!e.shiftKey)SEL.clear();SEL.add(all[ni]);applySel();
    box.querySelector(`.block[data-id="${CSS.escape(all[ni])}"]`)?.scrollIntoView({block:'nearest'});return true;
  }
  if(mod&&!e.shiftKey&&e.key.toLowerCase()==='d'){e.preventDefault();dupBlocks(ids);return true}
  if(mod&&e.key.toLowerCase()==='a'){e.preventDefault();selectBlocks(all);return true}
  if(e.key==='Tab'){e.preventDefault();indentBlocks(ids,e.shiftKey?-1:1);return true}
  if(mod&&e.altKey&&/^Digit[0-9]$/.test(e.code)){e.preventDefault();turnInto(ids,DIGIT_TYPES[+e.code.slice(5)]);return true}
  if(mod&&e.key==='/'){e.preventDefault();const b=getBlock(ids[0]);const h=box.querySelector(`.block[data-id="${CSS.escape(ids[0])}"] .handle`);if(b&&h)openBlockMenu(b,h);return true}
  if(e.key==='Escape'){e.preventDefault();clearSel();return true}
  return false;
}

/* ---------- right-click menus ---------- */
document.addEventListener('contextmenu',e=>{
  if(!S||e.shiftKey)return;
  const area=e.target.closest&&e.target.closest('#scroll,#peekBody');
  const rowEl=e.target.closest&&e.target.closest('#dbview [data-row]');
  if(rowEl&&area&&!(peek.on&&area.id==='scroll')&&!e.target.closest('input,select,textarea,.rt')){const db=curDb();const r=S.pages[rowEl.dataset.row];if(db&&r){e.preventDefault();openRowMenu(r,db,null,{x:e.clientX,y:e.clientY});return}}
  if(!area||(peek.on&&area.id==='scroll')||cur().kind==='db')return;
  if(e.target.closest('input,textarea,select,a,video'))return;
  const ed=e.target.closest('.ed,.ed2,.cap,td.tc');const sl=getSelection();
  if(ed&&sl.rangeCount&&!sl.isCollapsed&&ed.contains(sl.anchorNode)&&ed.contains(sl.focusNode)){e.preventDefault();openTextMenu(ed,{x:e.clientX,y:e.clientY});return}
  const row=e.target.closest('#blocks .block');
  let b=row?getBlock(row.dataset.id):null;
  if(!b&&SEL.size)b=getBlock(selIds()[0]);
  if(!b)return;
  e.preventDefault();
  if(!SEL.has(b.id))selectBlocks([b.id]);else{const a=document.activeElement;if(a&&a.blur&&pageEl.contains(a))a.blur()}
  openBlockMenu(b,null,{x:e.clientX,y:e.clientY});
});
function openTextMenu(ed,pt){
  let saved=getSelection().getRangeAt(0).cloneRange();const ctg=colorTarget(ed,saved);
  const restore=()=>{ed.focus();const s=getSelection();s.removeAllRanges();s.addRange(saved)};
  const items=[['bold','<b>B</b>','굵게','Ctrl+B'],['italic','<i>I</i>','기울임','Ctrl+I'],['underline','<u>U</u>','밑줄','Ctrl+U'],['strikeThrough','<s>S</s>','취소선','Ctrl+Shift+S'],['code','&lt;/&gt;','인라인 코드','Ctrl+E'],['link','🔗','링크','Ctrl+K']];
  const main=()=>`<div class="mh">선택한 글자</div>`+items.map(([c,i,l,k])=>`<div class="mi" data-c="${c}"><span class="bi s">${i}</span>${l}<span class="kb">${k}</span></div>`).join('')+
    `<div class="mi" data-c="color"><span class="bi s"><span class="tc-red">A</span></span>글자 색 · 배경색<span class="kb">▸</span></div><div class="mi" data-c="copy"><span class="bi s">⎘</span>복사<span class="kb">Ctrl+C</span></div><div class="mi" data-c="cut"><span class="bi s">✂</span>잘라내기<span class="kb">Ctrl+X</span></div>`;
  const m=menu(box,main(),{width:'240px'});place(m,{left:pt.x+2,top:pt.y,bottom:pt.y});
  m.onmousedown=x=>{if(x.target.closest('.mi,button'))x.preventDefault()};
  m.onclick=x=>{
    const cb=x.target.closest('[data-color]');
    if(cb){ctg.apply(cb.dataset.color);const s2=getSelection();if(s2.rangeCount&&!s2.isCollapsed)saved=s2.getRangeAt(0).cloneRange();redrawMenu(m,colorMenuHtml(ctg.colors()));return}
    const it=x.target.closest('[data-c]');if(!it)return;const c=it.dataset.c;
    if(c==='color'){m.innerHTML=colorMenuHtml(ctg.colors());return}
    closeAll();restore();
    if(c==='code')fmtCode(ed);
    else if(c==='link')fmtLink(ed);
    else if(c==='copy'||c==='cut'){let ok=false;try{ok=document.execCommand(c)}catch(_){}if(!ok)toast(`이 화면에서는 ${c==='copy'?'복사':'잘라내기'}를 쓸 수 없어요. Ctrl+${c==='copy'?'C':'X'}를 눌러 주세요.`);else if(c==='cut')syncEd(ed)}
    else{document.execCommand(c);syncEd(ed)}
  };
}

let mbBlock=null;
const EDIT_SEL='#blocks .ed,#blocks .ed2,#blocks .cap,#blocks td.tc,#title';
pageEl.addEventListener('focusin',e=>{

});

function placeMbar(){const vv=window.visualViewport;const m=$('#mbar');if(!vv){m.style.bottom='0px';return}m.style.bottom=Math.max(0,innerHeight-(vv.height+vv.offsetTop))+'px'}
if(window.visualViewport){visualViewport.addEventListener('resize',placeMbar);visualViewport.addEventListener('scroll',placeMbar)}
['pointerdown','mousedown'].forEach(t=>$('#mbar').addEventListener(t,e=>{if(e.target.closest('button'))e.preventDefault()}));
function mbMenu(btn,html){const m=menu(btn,html,{width:'250px'});place(m,$('#mbar').getBoundingClientRect());m.onmousedown=x=>{if(x.target.closest('button'))x.preventDefault()};return m}
$('#mbar').addEventListener('click',e=>{
  const btn=e.target.closest('[data-m]');if(!btn||!S)return;const m=btn.dataset.m;
  const a=document.activeElement;const ed=a&&a.closest&&a.closest('.ed,.ed2,.cap,td.tc');const off=ed?caretOffset(ed):0;
  const b=mbBlock&&getBlock(mbBlock);const refocus=()=>focusBlock(mbBlock,off);
  if(m==='undo'){undoRedo(false);return}
  if(m==='redo'){undoRedo(true);return}
  if(m==='done'){if(a&&a.blur)a.blur();$('#mbar').hidden=true;document.body.classList.remove('mbar-on');return}
  if(m==='bold'||m==='italic'){if(ed){document.execCommand(m);syncEd(ed)}return}
  if(!b){toast('먼저 편집할 블록을 눌러 주세요.');return}
  if(m==='insert'){
    const mm=mbMenu(btn,'<div class="mh">아래에 블록 추가</div>'+TYPES.map(x=>`<div class="mi" data-t="${x.t}"><span class="bi s">${esc(x.icon)}</span>${x.label}</div>`).join(''));
    mm.onclick=ev=>{const it=ev.target.closest('[data-t]');if(!it)return;closeAll();const p=cur();let tgt=b;
      if(!(b.type==='p'&&!strip(b.text))){tgt=B('p','',{indent:b.indent||0});p.blocks.splice(p.blocks.indexOf(b)+1,0,tgt);renderPage()}
      applyType(tgt,it.dataset.t,true);if(!['image','file','page','database','divider'].includes(it.dataset.t))focusBlock(tgt.id,0)};return;
  }
  if(m==='turn'){
    const mm=mbMenu(btn,'<div class="mh">블록 전환</div>'+TYPES.filter(x=>(!BOXY.includes(x.t)||x.t==='table'||x.t==='chart'||/^cols/.test(x.t))&&x.t!=='database').map(x=>`<div class="mi${x.t===b.type?' sel':''}" data-t="${x.t}"><span class="bi s">${esc(x.icon)}</span>${x.label}</div>`).join(''));
    mm.onclick=ev=>{const it=ev.target.closest('[data-t]');if(!it)return;closeAll();turnInto([b.id],it.dataset.t);refocus()};return;
  }
  if(m==='color'){
    const sl=getSelection();let hasSel=!!(ed&&sl.rangeCount&&!sl.isCollapsed);let saved=hasSel?sl.getRangeAt(0).cloneRange():null;
    if(!hasSel&&ed&&ed.matches('td.tc')&&ed.textContent){saved=document.createRange();saved.selectNodeContents(ed);hasSel=true}   // in a table cell: the whole cell
    const tg=hasSel?colorTarget(ed,saved):null;
    const mm=mbMenu(btn,(hasSel?'<div class="mh">선택한 글자에 적용 · 글자색과 배경색을 이어서 고를 수 있어요</div>':'<div class="mh">블록 전체에 적용 · 글자를 선택하면 일부만 바뀌어요</div>')+colorMenuHtml(hasSel?tg.colors():b.color||''));
    const keepOpen=ev=>{if(ev.target.closest('button,[data-color]'))ev.preventDefault()};   // a tap must not take focus / drop the selection
    mm.addEventListener('pointerdown',keepOpen);
    mm.onclick=x=>{const cb=x.target.closest('[data-color]');if(!cb)return;const cl=cb.dataset.color;
      if(tg){tg.apply(cl);redrawMenu(mm,'<div class="mh">선택한 글자에 적용 · 글자색과 배경색을 이어서 고를 수 있어요</div>'+colorMenuHtml(tg.colors()))}
      else{const st=pageScroller().scrollTop;colorBlocks([b.id],cl);pageScroller().scrollTop=st;redrawMenu(mm,'<div class="mh">블록 전체에 적용</div>'+colorMenuHtml((getBlock(b.id)||{}).color||''))}};return;
  }
  if(m==='todo'){turnInto([b.id],b.type==='todo'?'p':'todo');refocus();return}
  if(m==='indent'||m==='outdent'){indentBlocks([b.id],m==='indent'?1:-1);refocus();return}
  if(m==='up'||m==='down'){moveBlocks([b.id],m==='up'?-1:1);refocus();return}
  if(m==='del'){deleteBlocks([b.id]);return}
});

async function importFiles(files){
  if(!S)return;
  const loose=[];let did=false;
  for(const f of files){
    const n=(f.name||'').toLowerCase();
    if(n.endsWith('.zip')){
      if(!window.JSZip){toast('ZIP 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');continue}
      let zip;try{zip=await JSZip.loadAsync(f)}catch(_){toast(`${f.name}: ZIP 파일을 열 수 없어요.`);continue}
      const dj=zip.file('data.json');
      if(dj){try{const data=JSON.parse(await dj.async('string'));if(data&&data.pages&&Array.isArray(data.root)){await importBackupData(data,zip);did=true;continue}}catch(_){}}
      const entries=new Map();
      const add=async z=>{for(const zf of Object.values(z.files)){if(zf.dir)continue;
        if(/\.zip$/i.test(zf.name)){try{await add(await JSZip.loadAsync(await zf.async('arraybuffer')))}catch(_){}continue}
        entries.set(zf.name.replace(/^\/+/,''),{text:()=>zf.async('string'),blob:async()=>new Blob([await zf.async('arraybuffer')])})}};
      await add(zip);await importEntries(entries);did=true;continue;
    }
    if(n.endsWith('.json')){
      try{const data=JSON.parse(await f.text());if(!data||typeof data.pages!=='object'||!Array.isArray(data.root))throw 0;await importBackupData(data,null);did=true}
      catch(_){toast(`${f.name}: My Notion 백업 파일이 아니에요.`)}
      continue;
    }
    loose.push(f);
  }
  if(loose.some(f=>/\.(md|markdown|txt|csv)$/i.test(f.name))){
    const entries=new Map();loose.forEach(f=>entries.set(f.name,{text:()=>f.text(),blob:async()=>f}));
    await importEntries(entries);did=true;
  }
  if(!did)toast('가져올 수 있는 파일: Markdown(.md), CSV, 노션 내보내기 ZIP, My Notion 백업(ZIP·JSON)');
}
async function importEntries(entries){
  importStat.fail=0;
  const paths=[...entries.keys()].filter(p=>!/(^|\/)(__MACOSX|\.DS_Store)/.test(p));
  const mdP=paths.filter(p=>/\.(md|markdown|txt)$/i.test(p));
  const csvBy={};paths.filter(p=>/\.csv$/i.test(p)).forEach(p=>{const k=p.replace(/_all\.csv$/i,'.csv');if(!csvBy[k]||/_all\.csv$/i.test(p))csvBy[k]=p});
  const nCsv=Object.keys(csvBy).length;
  if(!mdP.length&&!nCsv){toast('가져올 Markdown 또는 CSV 파일이 없어요.');return}
  if(!await ask(`Markdown ${mdP.length}개${nCsv?`, 데이터베이스(CSV) ${nCsv}개`:''}를 페이지로 가져올까요? 지금 내용은 그대로 두고 새 페이지로 추가돼요.`,{ok:'가져오기'}))return;
  toast('가져오는 중…');
  const NP={},pathId={},dbFolder={};
  const mk=props=>{const p={id:uid(),title:'',icon:'📄',parent:null,children:[],blocks:[],open:false,created:Date.now(),updated:Date.now(),...props};NP[p.id]=p;return p};
  const cleanV=v=>String(v||'').replace(/\s*\([^)]*\.(md|csv)\)/gi,'').trim();
  for(const[key,cp] of Object.entries(csvBy)){
    let rows;try{rows=parseCSV(await entries.get(cp).text())}catch(_){continue}
    if(!rows.length)continue;
    const head=rows[0].map(h=>h.trim()||'속성');const data=rows.slice(1);
    const schema=head.slice(1).map((h,ci)=>{const vals=data.map(r=>cleanV(r[ci+1]));const t=inferType(vals);const pr={id:uid(),name:h,type:t};
      if(t==='select'||t==='multi')pr.options=[...new Set(vals.flatMap(v=>t==='multi'?v.split(/,\s*/):[v]).filter(Boolean))].map((n,i)=>({id:uid(),name:n,color:COLORS[i%COLORS.length]}));return pr});
    const views=[{id:uid(),name:'표',type:'table',sort:null,filters:[]}];
    const sel=schema.find(x=>x.type==='select');if(sel)views.push({id:uid(),name:'보드',type:'board',sort:null,filters:[],groupBy:sel.id});
    const dp=schema.find(x=>x.type==='date');if(dp)views.push({id:uid(),name:'캘린더',type:'calendar',sort:null,filters:[],dateProp:dp.id});
    const db=mk({kind:'db',icon:'🗃️',title:cleanName(baseName(key)),schema,views,activeView:views[0].id,_src:cp});
    pathId[key]=db.id;pathId[cp]=db.id;dbFolder[key.replace(/\.csv$/i,'')]=db.id;
    data.forEach(r=>{const props={};schema.forEach((pr,ci)=>{const v=cleanV(r[ci+1]);if(v)props[pr.id]=convVal(pr,v)});
      const row=mk({row:true,icon:'',title:cleanV(r[0]),parent:db.id,props});row._t=row.title;db.children.push(row.id)});
  }
  for(const p of mdP){
    const dbId=dbFolder[dirOf(p)];
    if(dbId){const db=NP[dbId];const t=cleanName(baseName(p));
      let row=db.children.map(id=>NP[id]).find(r=>r._t===t&&!r._md);
      if(!row){row=mk({row:true,icon:'',title:t,parent:db.id,props:{}});db.children.push(row.id)}
      row._md=p;pathId[p]=row.id;continue}
    pathId[p]=mk({title:cleanName(baseName(p)),_md:p}).id;
  }
  Object.values(NP).forEach(pg=>{
    if(pg.row)return;const src=pg._md||pg._src;if(!src)return;const d=dirOf(src);if(!d)return;
    const parId=pathId[d+'.md']||pathId[d+'.markdown'];const par=parId&&NP[parId];
    if(par&&par!==pg){pg.parent=par.id;par.children.push(pg.id)}
  });
  for(const pg of Object.values(NP)){
    if(!pg._md)continue;
    let text='';try{text=await entries.get(pg._md).text()}catch(_){}
    const blocks=mdToBlocks(text);
    if(blocks[0]&&blocks[0].type==='h1'){const t=strip(blocks[0].text).trim();if(t){if(!pg.row||!pg.title)pg.title=t;blocks.shift()}}
    if(pg.row){const names=new Set((NP[pg.parent].schema||[]).map(x=>x.name));
      while(blocks.length&&blocks[0].type==='p'){const mm=strip(blocks[0].text).match(/^([^:]{1,60}):\s/);if(mm&&names.has(mm[1].trim()))blocks.shift();else break}}
    const dir=dirOf(pg._md);const out=[];
    for(const b of blocks){
      if(b._link!==undefined){
        const target=normPath((dir?dir+'/':'')+decU(b._link.split('#')[0]));const id=pathId[target]||pathId[target.replace(/_all\.csv$/i,'.csv')];
        if(id){out.push(B('page','',{ref:id,indent:b.indent||0}));continue}
        if(entries.has(target)&&!/\.(md|markdown|csv)$/i.test(target)){out.push(await importAsset(entries,target,b._ltext,b.indent||0));continue}
        out.push(finishLoose([b])[0]);continue;
      }
      if(b._src!==undefined){out.push(await resolveImage(entries,dir,b));continue}
      out.push(b);
    }
    pg.blocks=out;
  }
  Object.values(NP).forEach(pg=>{
    if(pg.kind==='db')return;
    if(!pg.row)pg.children.forEach(cid=>{if(!NP[cid].row&&!pg.blocks.some(b=>b.type==='page'&&b.ref===cid))pg.blocks.push(B('page','',{ref:cid}))});
    if(!pg.blocks.length)pg.blocks.push(B('p'));
  });
  const tops=Object.values(NP).filter(p=>!p.parent&&!p.row);
  const holder=tops.length>1?newPage(null,{title:`가져온 페이지 (${new Date().toLocaleDateString('ko-KR')})`,icon:'📥',blocks:[]}):null;
  Object.values(NP).forEach(pg=>{delete pg._md;delete pg._t;delete pg._src;normalizePage(pg);S.pages[pg.id]=pg;markDirty(pg.id)});
  tops.forEach(pg=>{if(holder){pg.parent=holder.id;holder.children.push(pg.id);holder.blocks.push(B('page','',{ref:pg.id}))}else{S.root.push(pg.id);markDirty('meta')}});
  if(holder){holder.open=true;markDirty(holder.id)}
  go(holder?holder.id:(tops[0]?tops[0].id:S.current));
  toast(`페이지 ${Object.keys(NP).length}개를 가져왔어요.${importStat.fail?` 파일 ${importStat.fail}개는 가져오지 못했어요.`:''}`);
}

/* ---- my templates: pages kept under the "📋 내 템플릿" page (a normal page, so it syncs, has history and can be edited) ---- */
function tplHome(create=true){
  let h=Object.values(S.pages).find(p=>p.tplHome&&!p.trashed);
  if(!h&&create){h=newPage(null,{title:'내 템플릿',icon:'📋',tplHome:true});
    h.blocks=mdBlocks('<aside>\n📋 여기 있는 페이지가 템플릿 갤러리의 ‘내 템플릿’에 나와요. 이 안의 페이지를 고치면 템플릿도 바뀌고, 지우면 갤러리에서도 빠져요.\n</aside>');markDirty(h.id)}
  return h||null;
}
function inTplHome(id){let x=S.pages[id];const seen=new Set();while(x&&!seen.has(x.id)){if(x.tplHome)return true;seen.add(x.id);x=S.pages[x.parent]}return false}
function tplDesc(t){const d=descendants(t.id).filter(id=>!S.pages[id].trashed);const rows=d.filter(id=>S.pages[id].row).length,subs=d.length-rows;
  const first=t.kind==='db'?`데이터베이스 · 속성 ${(t.schema||[]).length}개`:((t.blocks||[]).map(b=>strip(b.text||'')).find(Boolean)||'').slice(0,60);
  return[first,subs?`하위 페이지 ${subs}개`:'',rows?`항목 ${rows}개`:''].filter(Boolean).join(' · ')||'빈 페이지'}
/* deep copy of a page with everything under it; links inside the copy point to the copied pages */
function copyTree(srcId,parent){
  const src=S.pages[srcId];if(!src)return null;
  const ids=[srcId,...descendants(srcId)].filter(id=>S.pages[id]&&!S.pages[id].trashed);
  const idm={};ids.forEach(id=>idm[id]=uid());const rm=x=>idm[x]||x;const now=Date.now();
  ids.forEach(id=>{const o=clone(S.pages[id]);
    o.id=idm[id];o.parent=id===srcId?(parent||null):rm(o.parent);
    o.children=(o.children||[]).filter(c=>idm[c]).map(rm);
    const bm={};o.blocks=(o.blocks||[]).filter(b=>!(b.type==='page'&&S.pages[b.ref]&&S.pages[b.ref].trashed)).map(b=>{const nid=uid();bm[b.id]=nid;return{...b,id:nid,...(b.ref?{ref:rm(b.ref)}:{})}});
    o.blocks.forEach(b=>{if(b.type==='chart'&&b.chart){if(b.chart.table&&bm[b.chart.table.id]){b.chart.table.id=bm[b.chart.table.id];b.chart.table.page=o.id}if(b.chart.db&&idm[b.chart.db.id])b.chart.db.id=idm[b.chart.db.id]}});
    if(o.kind==='db')(o.schema||[]).forEach(pr=>{if(pr.target)pr.target=rm(pr.target)});
    if(o.row&&o.props)Object.keys(o.props).forEach(k=>{if(Array.isArray(o.props[k]))o.props[k]=o.props[k].map(rm)});
    ['rev','lastSnap','_conf','trashed','tplHome'].forEach(k=>delete o[k]);
    o.created=o.updated=now;if(id===srcId)o.open=false;
    S.pages[o.id]=o;markDirty(o.id)});
  const top=S.pages[idm[srcId]];
  if(parent&&S.pages[parent]){S.pages[parent].children.push(top.id);S.pages[parent].open=true;markDirty(parent)}else{top.parent=null;S.root.push(top.id);markDirty('meta')}
  return top;
}
function saveAsTemplate(id){
  const p=S.pages[id];if(!p||p.row||p.tplHome)return;
  const home=tplHome(true);const t=copyTree(id,home.id);if(!t)return;
  home.blocks.push(B('page','',{ref:t.id}));touch(home.id,true);reconcileTree();renderSide();
  toast(`‘${p.title||'제목 없음'}’을(를) 내 템플릿에 저장했어요. 📋 템플릿에서 골라 쓸 수 있어요.`,{label:'템플릿 보기',fn:()=>openTemplates()});
}
function openTemplates(){
  if(!S)return;
  const cur0=cur();const canInside=cur0&&cur0.kind!=='db'&&!isTrashedCtx(cur0.id);
  const body=openPanel('템플릿','골라서 누르면 바로 만들어져요. 만든 뒤에는 자유롭게 고쳐 쓰면 돼요.');
  const cats=[...new Set(TEMPLATES.map(t=>t.cat))];
  const home=tplHome(false);const mine=home?home.children.map(id=>S.pages[id]).filter(x=>x&&!x.trashed):[];
  const mineHtml=`<div class="tplcat">내 템플릿${home?` <button class="linkbtn" data-a="home">✏ 관리</button>`:''}</div>`+(mine.length?'<div class="tplgrid">'+mine.map(t=>`<button class="tplcard mine" data-mine="${esc(t.id)}"><span class="tpli">${esc(t.icon||'📄')}</span><span class="tpln">${esc(t.title||'제목 없음')}</span><span class="tpld">${esc(tplDesc(t))}</span></button>`).join('')+'</div>':
    '<div class="tplempty">아직 없어요. 자주 쓰는 페이지에서 ⋯ → ‘템플릿으로 저장’을 누르면 여기에 생겨요. 하위 페이지·데이터베이스도 함께 저장돼요.</div>');
  body.innerHTML=`<div class="tplwhere"><span class="d">만들 위치</span><label><input type="radio" name="tplw" value="top" checked> 사이드바 최상위</label>${canInside?`<label><input type="radio" name="tplw" value="in"> ‘${esc(cur0.title||'제목 없음')}’ 안에</label>`:''}</div>`+mineHtml+
    cats.map(c=>`<div class="tplcat">${esc(c)}</div><div class="tplgrid">`+TEMPLATES.filter(t=>t.cat===c).map(t=>`<button class="tplcard" data-tpl="${t.id}"><span class="tpli">${t.icon}</span><span class="tpln">${esc(t.name)}</span><span class="tpld">${esc(t.desc)}</span></button>`).join('')+'</div>').join('');
  body.onclick=e=>{
    const where=(body.querySelector('input[name="tplw"]:checked')||{}).value;const par=where==='in'&&canInside?cur0.id:null;
    if(e.target.closest('[data-a="home"]')){closePanel();go(home.id);return}
    const mb=e.target.closest('[data-mine]');if(mb){const src=S.pages[mb.dataset.mine];if(!src)return;
      const made=copyTree(src.id,par);if(!made)return;if(par){S.pages[par].blocks.push(B('page','',{ref:made.id}));touch(par,true)}
      reconcileTree();closePanel();go(made.id);toast(`‘${src.title||'제목 없음'}’ 템플릿으로 만들었어요.`,{label:'되돌리기',fn:()=>trashPage(made.id)});return}
    const b=e.target.closest('[data-tpl]');if(!b)return;const t=TEMPLATES.find(x=>x.id===b.dataset.tpl);if(!t)return;
    const made=t.build(par);if(par)touch(par,true);reconcileTree();closePanel();go(made.id);toast(`‘${t.name}’ 템플릿으로 만들었어요.`,{label:'되돌리기',fn:()=>trashPage(made.id)})};
}

$('#tplBtn').onclick=()=>{if(mobile())document.body.classList.add('noside');openTemplates()};

function vChart(x){

  o.kind=CH_KINDS.some(k=>k[0]===c.kind)?c.kind:'bar';o.src=['manual','table','db'].includes(c.src)?c.src:'manual';
  o.labels=(Array.isArray(c.labels)?c.labels:[]).slice(0,CH_MAX_R).map(l=>str(String(l??''),200));
  o.series=(Array.isArray(c.series)?c.series:[]).slice(0,CH_MAX_S).map(s=>({name:str(String((s&&s.name)??''),100),vals:(Array.isArray(s&&s.vals)?s.vals:[]).slice(0,CH_MAX_R).map(v=>typeof v==='number'&&isFinite(v)?v:typeof v==='string'?v.slice(0,40):''),...(s&&/^#[0-9a-f]{6}$/i.test(s.color||'')?{color:s.color}:{})}));
  if(c.table&&ID_RE.test(c.table.id||''))o.table={id:c.table.id,page:ID_RE.test(c.table.page||'')?c.table.page:null,head:c.table.head!==false,first:c.table.first!==false};
  if(c.db&&ID_RE.test(c.db.id||''))o.db={id:c.db.id,group:c.db.group==='title'||ID_RE.test(c.db.group||'')?c.db.group:'title',agg:['count','sum','avg'].includes(c.db.agg)?c.db.agg:'count',...(ID_RE.test(c.db.val||'')?{val:c.db.val}:{}),...(c.db.month?{month:true}:{}),...(c.db.optColor?{optColor:true}:{})};
  if(Array.isArray(c.colors))o.colors=c.colors.slice(0,CH_MAX_S).map(x=>/^#[0-9a-f]{6}$/i.test(x||'')?x:'');
  ['title','xLabel','yLabel'].forEach(k=>{if(c[k])o[k]=str(String(c[k]),200)});if(c.unit)o.unit=str(String(c.unit),12);
  o.legend=['top','bottom','right','none'].includes(c.legend)?c.legend:'bottom';o.fs=CH_FS[c.fs]?c.fs:'m';o.pal=CH_PAL[c.pal]?c.pal:'default';

  ['stacked','smooth','values','round','border','dash'].forEach(k=>{if(c[k])o[k]=true});
  ['grid','dots','zero','center'].forEach(k=>{o[k]=c[k]!==false});
  if(['light','dark'].includes(c.bg))o.bg=c.bg;if([1,2,3,4,6].includes(+c.lw))o.lw=+c.lw;if(c.valMode==='value')o.valMode='value';
  ['yMin','yMax'].forEach(k=>{if(typeof c[k]==='number'&&isFinite(c[k]))o[k]=c[k]});
  return o;
}

  </div>`;
  const q=s=>body.querySelector(s);
  const read=()=>{st.from=q('#fbFrom').value.trim();st.text=q('#fbText').value;st.kind=(q('input[name="fbk"]:checked')||{}).value||'idea';st.env=q('#fbEnv').checked;st.host=q('#fbHost').value.trim()};
  const keep=()=>{read();Settings.fbFrom=st.from;Settings.fbDraft={kind:st.kind,text:st.text,env:st.env};const h=fbHost(st.host);if(h)Settings.fbHost=h;saveSettings()};
  const kindName=()=>(FB_KINDS.find(k=>k[0]===st.kind)||FB_KINDS[3])[1].replace(/^\S+\s/,'');
  const subj=()=>{const first=st.text.trim().split('\n')[0].slice(0,40);return `[My Notion 피드백] ${kindName()}${first?' - '+first:''}`};
  const mailBody=()=>`보내는 사람: ${st.from}\n종류: ${kindName()}\n\n${st.text.trim()}\n${st.env?'\n───────────\n'+fbEnv():''}`;
  const all=()=>`받는 사람: ${FB_TO}\n제목: ${subj()}\n\n${mailBody()}`;
  const ok=()=>{read();if(!st.from){toast('보내는 사람을 적어 주세요.');q('#fbFrom').focus();return false}if(!st.text.trim()){toast('피드백 사항을 적어 주세요.');q('#fbText').focus();return false}return true};
  const copy=(txt,msg)=>copyText(txt).then(r=>{toast(r?msg:'이 화면에서는 자동 복사가 안 돼요. 파일로 저장해서 첨부해 주세요.');return r});
  const log=()=>{const l=(Settings.fbLog||[]).slice(0,19);l.unshift({at:Date.now(),subj:subj()});Settings.fbLog=l;saveSettings()};
  const openUrl=u=>{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove()};
  let t=0;body.oninput=()=>{clearTimeout(t);t=setTimeout(keep,400)};body.onchange=keep;
  body.onclick=async e=>{
    const cp=e.target.closest('[data-cp]')?.dataset.cp;
    if(cp){if(cp==='to'){copy(FB_TO,'받는 사람 주소를 복사했어요.');return}if(!ok())return;keep();
      if(cp==='subj')copy(subj(),'제목을 복사했어요.');else copy(mailBody(),'본문을 복사했어요.');return}
    const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;
    if(a==='done'){Settings.fbDraft={};saveSettings();q('#fbText').value='';toast('작성 내용을 지웠어요. 피드백 고마워요!');return}
    if(!ok())return;keep();
    const E=encodeURIComponent;
    if(a==='gmail'){openUrl(`https://mail.google.com/mail/?view=cm&fs=1&to=${E(FB_TO)}&su=${E(subj())}&body=${E(mailBody())}`);log();toast('Gmail 쓰기 화면을 열었어요. 로그인돼 있지 않으면 로그인 후 다시 눌러 주세요.');return}
    if(a==='outlook'){openUrl(`https://outlook.live.com/mail/0/deeplink/compose?to=${E(FB_TO)}&subject=${E(subj())}&body=${E(mailBody())}`);log();toast('Outlook 쓰기 화면을 열었어요.');return}
    if(a==='naver'||a==='daum'){await copy(all(),'메일 전체를 복사했어요. ‘메일 쓰기’에 붙여넣어 주세요.');openUrl(a==='naver'?'https://mail.naver.com/':'https://mail.daum.net/');log();return}
    if(a==='mailto'){openUrl(`mailto:${FB_TO}?subject=${encodeURIComponent(subj())}&body=${encodeURIComponent(mailBody())}`);log();toast('메일 앱이 열리지 않으면 Gmail·네이버 등 다른 방법이나 파일 저장을 써 주세요.');return}
    if(a==='file'){const okk=await saveFile(`My Notion 피드백 ${ymd(new Date())}.txt`,new Blob([all()],{type:'text/plain;charset=utf-8'}));if(okk){log();toast(`파일로 저장했어요. 메일에 첨부해서 ${FB_TO} 로 보내 주세요.`)}return}
  };
}
async function copyText(txt){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(txt);return true}}catch(_){}
  try{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();const r=document.execCommand('copy');ta.remove();return r}catch(_){return false}
}

$('#fbBtn').onclick=()=>{if(mobile())document.body.classList.add('noside');openFeedback()};

/* =========================================================
   Notion exchange: export in Notion's own export layout (Markdown pages, CSV databases,
   a folder per page for what is inside it, attachments next to them) so Notion's
   "Import" can read it; Notion's "Export → Markdown & CSV" ZIP comes back in with 📥 가져오기.
   ========================================================= */
let MD_HOOK=null;      // {link(pageId)→path, img(block)→path} while exporting for Notion
const nzName=(p)=>`${String(p.title||'제목 없음').replace(/[\\/:*?"<>|#%\n\r\t]/g,' ').replace(/\s+/g,' ').trim().slice(0,80)||'제목 없음'} ${p.id.replace(/[^a-z0-9]/gi,'').slice(0,12)}`;
const nzEnc=path=>path.split('/').map(encodeURIComponent).join('/');
function csvCell(s){s=String(s??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
async function notionExport(rootIds,label){
  if(!window.JSZip){toast('ZIP 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.');return}
  if(dirty.size){clearTimeout(flushT);await flush()}
  const zip=new JSZip();const assets=[];let pages=0,dbs=0;
  const relTo=(fromDir,path)=>{const a=fromDir?fromDir.split('/'):[],b=path.split('/');let i=0;while(i<a.length&&i<b.length-1&&a[i]===b[i])i++;return[...a.slice(i).map(()=>'..'),...b.slice(i)].join('/')};
  const paths={};
  const plan=(id,dir)=>{const p=S.pages[id];if(!p||p.trashed)return;const nm=nzName(p);paths[id]={dir,file:(dir?dir+'/':'')+nm+(p.kind==='db'?'.csv':'.md'),sub:(dir?dir+'/':'')+nm};
    (p.children||[]).forEach(c=>plan(c,paths[id].sub))};
  rootIds.forEach(id=>plan(id,''));
  const write=(id)=>{const p=S.pages[id];if(!p||p.trashed||!paths[id])return;const P=paths[id];
    MD_HOOK={link:ref=>paths[ref]?nzEnc(relTo(P.dir,paths[ref].file)):null,
      img:b=>{if(!b.asset&&!b.data)return null;const ext=b.asset?(TYPE_EXT[b.mime]||'bin'):((b.data.match(/^data:image\/(\w+)/)||[])[1]||'png');const fn=`${(b.name||'image').replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|#%]/g,'_').slice(0,60)||'image'} ${b.id.slice(0,6)}.${ext}`;const path=P.sub+'/'+fn;assets.push({b,path});return nzEnc(relTo(P.dir,path))}};
    try{
      if(p.kind==='db'){dbs++;const cols=['이름',...p.schema.map(x=>x.name)];
        const rows=(p.children||[]).map(c=>S.pages[c]).filter(r=>r&&r.row&&!r.trashed);
        zip.file(P.file,'﻿'+[cols,...rows.map(r=>[r.title||'',...p.schema.map(pr=>valText(pr,val(p,r,pr)))])].map(r=>r.map(csvCell).join(',')).join('\n'));
        // the page around the database (Notion keeps the description as a page with the same name)
      }else{pages++;
        const head=[`# ${p.title||'제목 없음'}`,''];
        if(p.row){const db=dbOf(p);if(db&&db.schema)rowSchema(db,p).forEach(pr=>{const v=valText(pr,val(db,p,pr));if(v)head.push(`${pr.name}: ${v}`)});head.push('')}
        let body=blocksToMd(p.blocks||[]);
        // sub-pages that are not linked from the page body still get a link at the end, like Notion
        const linked=new Set((p.blocks||[]).filter(b=>b.type==='page').map(b=>b.ref));
        const extra=(p.children||[]).filter(c=>paths[c]&&!linked.has(c)&&!S.pages[c].row);
        if(extra.length)body+='\n\n'+extra.map(c=>`[${S.pages[c].title||'제목 없음'}](${nzEnc(relTo(P.dir,paths[c].file))})`).join('\n\n');
        zip.file(P.file,(head.join('\n')+'\n'+body).replace(/\n{3,}/g,'\n\n'));
      }
    }finally{MD_HOOK=null}
    (p.children||[]).forEach(write);
  };
  rootIds.forEach(write);
  let miss=0;
  for(let i=0;i<assets.length;i++){const{b,path}=assets[i];toast(`첨부파일 담는 중… ${i+1}/${assets.length}`);
    try{if(b.asset){const r=await fetch('/_blob/'+b.asset);if(!r.ok)throw 0;zip.file(path,await r.blob())}else zip.file(path,dataUrlBytes(b.data))}catch(_){miss++}}
  const out=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
  const ok=await saveFile(`Notion용 내보내기 ${label.replace(/[\\/:*?"<>|]/g,'_')} ${stamp()}.zip`,out);
  if(ok)toast(`Notion용 ZIP을 만들었어요. 페이지 ${pages}개 · 데이터베이스 ${dbs}개${assets.length?` · 첨부 ${assets.length-miss}개`:''}${miss?` (못 담은 파일 ${miss}개)`:''}`);
}
function openNotionSync(id){
  const p=id&&S.pages[id];const subs=p?descendants(id).filter(x=>!S.pages[x].trashed).length:0;
  const body=openPanel('Notion 연동','My Notion ↔ Notion 사이에서 페이지를 주고받아요.');
  body.innerHTML=`<div class="nzbox">
    <div class="sh">⬆ Notion으로 보내기</div>
    ${p?`<label class="opt"><input type="radio" name="nzs" value="page" checked><span><b>‘${esc(p.title||'제목 없음')}’${subs?` + 하위 ${subs}개`:''}</b></span></label>`:''}
    <label class="opt"><input type="radio" name="nzs" value="all" ${p?'':'checked'}><span><b>전체 워크스페이스</b><span class="d">사이드바의 모든 페이지·데이터베이스 (휴지통 제외)</span></span></label>
    <button class="btn primary" data-a="exp" style="margin:6px 0">⬇ Notion용 ZIP 만들기</button>
    <ol class="nzsteps"><li>Notion에서 <b>설정 → 가져오기(Import)</b>를 열어요.</li><li><b>Text &amp; Markdown</b>(또는 ZIP 업로드)을 고르고 받은 ZIP을 올려요.</li><li>페이지는 Markdown으로, 데이터베이스는 CSV로 들어가 Notion 데이터베이스가 돼요. 그림·첨부도 함께 들어가요.</li></ol>
    <div class="sh" style="margin-top:14px">⬇ Notion에서 가져오기</div>
    <ol class="nzsteps"><li>Notion 페이지 ⋯ → <b>내보내기(Export)</b> → 형식 <b>Markdown &amp; CSV</b>, <b>하위 페이지 포함</b>을 켜고 내보내요.</li><li>받은 ZIP을 여기 사이드바의 <b>📥 가져오기</b>에 그대로 넣어요. 페이지·데이터베이스·그림이 ‘가져온 페이지’로 들어와요.</li></ol>
    <button class="btn" data-a="imp">📥 가져오기 열기</button>
    <div class="nznote"><b>자동(실시간) 동기화는 아직 안 돼요.</b> claude.ai 화면 안의 이 앱은 Notion 서버에 직접 접속할 수 없어서, 지금은 파일로 주고받는 방식이에요. claude.ai의 Notion 커넥터를 연결하면 그걸 통해 버튼 한 번으로 보내고 받는 기능을 붙일 수 있어요.</div>
  </div>`;
  body.onclick=async e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;
    if(a==='imp'){closePanel();$('#impIn').click();return}
    if(a==='exp'){const sc=(body.querySelector('input[name="nzs"]:checked')||{}).value;const b=e.target.closest('button');b.disabled=true;
      try{if(sc==='page'&&p)await notionExport([p.id],p.title||'페이지');else await notionExport(S.root.filter(x=>S.pages[x]&&!S.pages[x].trashed),'전체')}catch(err){toast('만들지 못했어요: '+(err&&err.message||err))}finally{b.disabled=false}}};
}

/* ---- order of the menu at the bottom of the sidebar (템플릿 · 휴지통 · 가져오기 · 백업 · 단축키 · 설정) ---- */
const FOOT_DEF=['keysBtn','trashBtn','tplBtn','impBtn','expBtn','fbBtn','setBtn'];
function footIds(){const saved=Array.isArray(Settings.footOrder)?Settings.footOrder.filter(x=>FOOT_DEF.includes(x)):[];return[...new Set([...saved,...FOOT_DEF])]}
function footLabel(id){const e=document.getElementById(id);if(!e)return id;const c=e.cloneNode(true);c.querySelectorAll('input,.d').forEach(x=>x.remove());return c.textContent.trim()}
function applyFootOrder(){const f=$('.sfoot');if(!f)return;footIds().forEach(id=>{const e=document.getElementById(id);if(e)f.appendChild(e)})}
function moveFoot(id,d){const a=footIds();const i=a.indexOf(id),k=i+d;if(i<0||k<0||k>=a.length)return;[a[i],a[k]]=[a[k],a[i]];Settings.footOrder=a;saveSettings();applyFootOrder()}
(()=>{const f=$('.sfoot');if(!f)return;applyFootOrder();let dragId=null;
  f.querySelectorAll('.sbtn').forEach(b=>{b.draggable=true;b.title=b.title||'끌어서 순서를 바꿀 수 있어요'});
  f.addEventListener('dragstart',e=>{const b=e.target.closest&&e.target.closest('.sfoot > .sbtn');if(!b)return;dragId=b.id;b.classList.add('fdrag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','')}catch(_){}});
  f.addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();const b=e.target.closest&&e.target.closest('.sfoot > .sbtn');const me=document.getElementById(dragId);if(!b||b===me)return;
    const r=b.getBoundingClientRect();f.insertBefore(me,e.clientY<r.top+r.height/2?b:b.nextSibling)});
  const end=()=>{if(!dragId)return;document.getElementById(dragId)?.classList.remove('fdrag');dragId=null;
    Settings.footOrder=[...f.children].map(x=>x.id).filter(x=>FOOT_DEF.includes(x));saveSettings()};
  f.addEventListener('drop',e=>{if(dragId)e.preventDefault();end()});f.addEventListener('dragend',end);
})();

/* ---------- init ---------- */
if(mobile())document.body.classList.add('noside');
boot();
</script>
